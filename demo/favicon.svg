<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background: Deep Indigo-to-Violet gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Timezone transition gradient: Cyan (Local) to Fuchsia (UTC) -->
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Modern App Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Recurring Cron Orbit Arrow -->
  <path d="M32 9 A23 23 0 1 1 9 32" fill="none" stroke="url(#orbit)" stroke-width="4" stroke-linecap="round"/>
  <polygon points="32,4 39,9 32,14" fill="#38bdf8"/>

  <!-- Clock Dial -->
  <circle cx="32" cy="32" r="15" fill="#0f172a" fill-opacity="0.45" stroke="#ffffff" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Clock Hands -->
  <line x1="32" y1="32" x2="23" y2="36" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="32" y2="21" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.8" fill="#ffffff"/>

  <!-- 5 Cron Field Pips (* * * * *) -->
  <circle cx="49" cy="15" r="2.2" fill="#38bdf8"/>
  <circle cx="55" cy="22" r="2.0" fill="#60a5fa"/>
  <circle cx="57" cy="31" r="1.8" fill="#818cf8"/>
  <circle cx="54" cy="40" r="1.6" fill="#a78bfa"/>
  <circle cx="48" cy="48" r="1.4" fill="#c084fc"/>
</svg>
